# Generates the "contribution snake" SVGs used in README.md under "Contribution Snake".
# One-time setup after this repo is pushed to GitHub as `abhichandra-v`:
#   1. Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions" (so the
#      job can push the generated SVGs to the `output` branch).
#   2. Actions tab -> run this workflow once manually (or just push -- it also runs on push to main/master).
#   3. It creates/updates an `output` branch containing the SVGs the README already links to.
name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
